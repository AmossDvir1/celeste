name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Celeste version or commit
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: vendor
    attributes:
      label: Vendor involved
      options: [None, GitHub Copilot, Claude, OpenAI, Gemini]
  - type: textarea
    id: logs
    attributes:
      label: Anything else
      description: Screenshots or error text help. Remove keys, tokens and account details first.
