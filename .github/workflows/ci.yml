name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci-report.mjs --raw npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Celeste for Android (phone/): typechecked and built on every push, so a release is never the first build. The APK is a debug
  # build, kept for two weeks as a download of the run. Release builds are signed in release.yml.
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            phone/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The app shares the protocol, types and reducer in src/ with the desktop app, so both sets of packages are needed.
      - run: node scripts/ci-report.mjs --raw npm ci
      - run: npm --prefix phone ci
      - run: npm --prefix phone run typecheck
      - run: npm --prefix phone run apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: phone/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  # The real app, started and driven (Playwright for Electron) on a Mac. None of these needs an account or spends anything: Claude is
  # the real program talking to a stand-in for Anthropic's API on the runner. This is how Celeste is tried on macOS, since nobody
  # working on it has a Mac. It reports problems without blocking a merge (continue-on-error) until it has been green for a while.
  app-checks-mac:
    name: App check ${{ matrix.check }} (macOS)
    runs-on: macos-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        check: [persistence, ui, checkpoints, worktrees, mcp, terminal, files, claude, workflows, workflows-chat, workflows-ai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci-report.mjs --raw npm ci
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.com" && git config --global init.defaultBranch main
      # The wrapper also writes the reason for a failure as an annotation, which is readable without opening the log.
      - run: node scripts/ci-report.mjs verify:${{ matrix.check }}
      - name: Keep the pictures the check made
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictures-${{ matrix.check }}
          path: scripts/.output/
          if-no-files-found: ignore

  # The installers, made and tried on every push, so that a release is never the first time they are built. Windows: installed silently,
  # run and uninstalled. Mac: the packed app is started and looked inside. The files are kept for two weeks as downloads of the run, so a
  # person can try exactly what a release would contain. (Nothing here is published; see RELEASING.md.)
  installers:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, make: 'npm run dist:win', files: "release/*.exe\nrelease/*.msi" }
          - { name: macOS arm64, os: macos-latest, make: 'npm run dist:mac -- --arm64', files: "release/*.dmg\nrelease/*.zip" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci-report.mjs --raw npm ci
      - name: Stop Spotlight indexing the disk image that is about to be made
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true
      - name: Make the installer (the Mac disk image is flaky to make on these machines, so it is tried up to three times)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ${{ matrix.make }}; then exit 0; fi
            echo "Attempt $attempt failed."
            sleep 15
          done
          exit 1
      - run: node scripts/ci-report.mjs installer-check
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.files }}
          retention-days: 14
          if-no-files-found: error
